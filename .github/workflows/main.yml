name: Frontend + Backend CI

on:
  push:
  pull_request:

jobs:

  # -------------------------
  # FRONTEND (React + TS)
  # -------------------------
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Build React app
        run: |
          cd client
          npm run build

  # -------------------------
  # BACKEND (.NET)
  # -------------------------
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0

      - name: Restore dependencies
        run: |
          cd server
          dotnet restore server.sln

      - name: Build backend solution
        run: |
          cd server
          dotnet build server.sln --configuration Release

      - name: Run backend tests
        run: |
          cd server
          dotnet test server.sln --no-build --configuration Release
